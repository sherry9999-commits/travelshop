# Netlify build configuration.
#
# Continuous deployment from GitHub (sherry9999-commits/travelshop, branch main)
# reads these settings, so future pushes to main rebuild the live review site
# automatically.
#
# The real domain travelshop-jordan.com is deliberately NOT configured here.
# This file only describes how the site is built.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Hashed build assets are immutable; the HTML entry point stays revalidated.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# No SPA catch-all rewrite on purpose. Every route is a same-page hash anchor,
# so `/* /index.html 200` would only mask genuine 404s for missing assets.
